[package]
name = "dbman"
description = "A multi-database client in the spirit of DataGrip"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
dbman-core = { path = "../dbman-core" }
dbman-drivers = { path = "../dbman-drivers" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
keyring = "4.2.0"
eframe = "0.36.2"
egui = "0.36.2"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shadcn_egui = { git = "https://github.com/georgebigscar-spec/shadcn_egui", rev = "bcc871a0832cdddd49eb121490bc6aa30e331114" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
similar = "3.2.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
duckdb = { version = "1.10506.0", features = ["bundled", "parquet"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

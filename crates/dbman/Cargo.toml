[package]
name = "dbman"
description = "A multi-database client in the spirit of DataGrip"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
dbman-core = { path = "../dbman-core" }
dbman-drivers = { path = "../dbman-drivers" }
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shadcn_egui = { git = "https://github.com/georgebigscar-spec/shadcn_egui", rev = "7425c3f3b33934fb7cb087e0e39d34c6ab6f965c" }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"

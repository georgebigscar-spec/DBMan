[package]
name = "dbman-drivers"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
async-trait = "0.1.92"
duckdb = { version = "1.10506.0", features = ["bundled", "parquet"] }
dbman-core = { version = "0.1.0", path = "../dbman-core" }
futures-util = "0.3.34"
mysql_async = { version = "0.37.1", features = ["native-tls-tls"] }
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "column_decltype"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-postgres = "0.7.18"

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "dbman-drivers"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
async-trait = "0.1.92"
duckdb = { version = "1.10506.0", features = ["bundled", "parquet"] }
dbman-core = { version = "0.1.0", path = "../dbman-core" }
futures-util = "0.3.34"
mysql_async = { version = "0.37.1", features = ["native-tls-tls"] }
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "column_decltype"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-postgres = "0.7.18"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "chrono"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "query"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

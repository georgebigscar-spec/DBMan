name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dbman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dbman
          MYSQL_DATABASE: dbman_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdbman" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: DbMan_Pass1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DbMan_Pass1 -Q 'SELECT 1' || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DBMAN_TEST_POSTGRES: postgres://postgres:dbman@127.0.0.1:5432/postgres
      DBMAN_TEST_MYSQL: mysql://root:dbman@127.0.0.1:3306/dbman_test
      DBMAN_TEST_MSSQL: mssql://sa:DbMan_Pass1@127.0.0.1:1433/dbman_test
      DBMAN_TEST_CLICKHOUSE: clickhouse://default:dbman@127.0.0.1:8123/dbman_test
      DBMAN_TEST_COCKROACH: postgres://root@127.0.0.1:26257/dbman_test
      DBMAN_TEST_TIDB: mysql://root@127.0.0.1:4000/dbman_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Started here rather than as a service: it needs the backups disk config from the repository.
      - name: Start ClickHouse
        run: |
          docker run -d --name clickhouse -p 8123:8123 \
            -e CLICKHOUSE_PASSWORD=dbman -e CLICKHOUSE_DB=dbman_test -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "$GITHUB_WORKSPACE/ci/clickhouse-backups.xml:/etc/clickhouse-server/config.d/backups.xml" \
            clickhouse/clickhouse-server:24.8
          for i in $(seq 60); do
            curl -sf "http://default:dbman@127.0.0.1:8123/?query=SELECT%201" && exit 0
            sleep 1
          done
          docker logs clickhouse
          exit 1
      # Products on the PostgreSQL and MySQL protocols; their images need arguments services cannot pass.
      - name: Start CockroachDB and TiDB
        run: |
          docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          docker run -d --name tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for i in $(seq 60); do
            psql "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable" -c "CREATE DATABASE IF NOT EXISTS dbman_test" \
              && mysql -h 127.0.0.1 -P 4000 -u root -e "CREATE DATABASE IF NOT EXISTS dbman_test" && exit 0
            sleep 1
          done
          docker logs cockroach
          docker logs tidb
          exit 1
      - run: cargo test --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

[workspace]
resolver = "2"
members = ["crates/dbman-core", "crates/dbman-drivers", "crates/dbman"]
default-members = ["crates/dbman"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/georgebigscar-spec/DBMan"

# The bundled DuckDB is a large C++ build: without debug info it builds
# faster and takes gigabytes less disk.
[profile.dev.package.libduckdb-sys]
debug = false
